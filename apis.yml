name: SuperCircle
description: 'SuperCircle (operated by MASC Inc.) is a technology and reverse-logistics
  platform that helps retail and fashion brands run circular-economy programs for textiles.
  It provides turnkey trade-in and resale programs that let consumers send worn clothing
  back to brands for store credit, manages excess and overstock inventory through a
  warehouse pickup and logistics network, and delivers real-time performance tracking
  and customizable impact reporting on recycling and diversion outcomes. Brand partners
  include Reformation, tentree, Parachute, A.L.C., and Subset. No public developer API,
  documentation, or SDK surface was found at the time of enrichment; this profile is
  a company lead in the API Evangelist network.'
